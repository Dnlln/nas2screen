plugins {
    id 'com.android.application'
}

def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file("keystore.properties")
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'com.nas2screen.screensaver'
    compileSdk 34

    defaultConfig {
        applicationId "com.nas2screen.screensaver"
        minSdk 28
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
        resourceConfigurations += ["en", "ru"]
    }

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig keystorePropsFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
        debug {
            applicationIdSuffix ""
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
        disable 'ExpiredTargetSdkVersion', 'UnusedResources'
    }

    packaging {
        resources {
            excludes += [
                    'META-INF/LICENSE.txt',
                    'META-INF/LICENSE',
                    'META-INF/NOTICE.txt',
                    'META-INF/NOTICE',
                    'META-INF/DEPENDENCIES',
                    'META-INF/versions/9/module-info.class',
                    'META-INF/*.kotlin_module'
            ]
        }
    }

    buildFeatures {
        buildConfig true
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                // keep Robolectric's runtime jars and its lock file inside the repository
                def robolectricHome = new File(rootProject.projectDir, ".robolectric-deps/home")
                robolectricHome.mkdirs()
                systemProperty 'user.home', robolectricHome.absolutePath
                systemProperty 'maven.repo.local', new File(robolectricHome, ".m2/repository").absolutePath
                systemProperty 'robolectric.logging', 'stdout'
                maxHeapSize '2g'
            }
        }
    }
}

dependencies {
    implementation 'androidx.security:security-crypto:1.0.0'

    implementation('com.hierynomus:smbj:0.13.0') {
        exclude group: 'org.bouncycastle', module: 'bcprov-jdk18on'
    }
    implementation 'org.bouncycastle:bcprov-jdk15to18:1.78.1'
    implementation 'org.slf4j:slf4j-api:2.0.9'
    implementation 'org.slf4j:slf4j-simple:2.0.9'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.13'
}
